summary: >-
  One published request ceiling — 120 requests per minute, enforced per IP, answered with HTTP 429
  {"error":"rate_limited"} and a Retry-After of 60 seconds — plus a documented capacity-shed 503 {"error":"busy"}
  with Retry-After 2 seconds that the spec says is "not a failure of the request itself". Separately, the three
  PIN routes carry a metered daily free allowance of 25 calls per client, signalled on every metered 200 by
  X-Free-Tier / X-Free-Tier-Limit / X-Free-Tier-Remaining (observed live: true / 25 / 24); exhausting it produces a
  402 payment challenge, not a 429. No RateLimit-* or X-RateLimit-* headers are documented on ordinary responses,
  and none were observed. Neither the 429 nor the 503 was triggered during this pass.
rate_limits:
- name: Per-IP request ceiling
  scope: per-ip
  window: 1 minute
  limit: 120
  burst: undocumented
  applies_to: [v1_search, v1_parcel, v1_dossier, v1_comps]
  exhaustion_status: 429
  exhaustion_body: '{"error":"rate_limited","detail":"..."}'
  retry_after_seconds: 60
  source: https://api.ingest0r.com/pricing
- name: Daily free allowance (PIN routes)
  scope: per-client
  window: 1 day (resets 00:00 UTC)
  limit: 25
  applies_to: [v1_parcel, v1_dossier, v1_comps]
  exhaustion_status: 402

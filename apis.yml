apis:
- aid: ingest0r-com:cook-county-property-records-mcp-server
  name: Cook County (Chicago) Property Records MCP Server
  description: >-
    A live remote MCP server at https://api.ingest0r.com/mcp (streamable-http, JSON-RPC 2.0 over HTTP
    POST, protocol 2025-11-25, serverInfo cook-county-chicago-property-data 1.27.2) exposing five read-only
    tools: get_free_sample ($0, fixed example of every response shape), search_chicago_property_by_address
    (always free), get_cook_county_parcel ($0.01), get_cook_county_property_dossier ($0.03) and find_chicago_comparable_sales
    ($0.10), each annotated readOnlyHint/idempotentHint true. tools/list answers anonymously — no OAuth,
    no API key — and the first 25 paid-tool calls per client per day are free; past that the tool result
    carries the x402 402 under _meta["x402/error"] and accepts payment via _meta["x402/payment"] (agents-SDK
    x402 convention). The server is also advertised at /.well-known/mcp.json. Each tool binds one-to-one
    to an OpenAPI operationId (see the tool crosswalk).
  humanURL: https://api.ingest0r.com/mcp
  baseURL: https://api.ingest0r.com/mcp

apis:
- aid: ingest0r-com:cook-county-property-records-api
  name: Cook County (Chicago) Property Records API
  description: >-
    Four GET operations on https://api.ingest0r.com described by the provider's OpenAPI 3.1 (version 0.4.2):
    v1_search resolves a full or partial street address to ranked parcel PINs with a match_quality flag (always
    free); v1_parcel returns one parcel record by PIN with the street address joined in ($0.01); v1_dossier returns
    the full property record — parcel basics plus recorded sales and deed history, building permits linked to the
    PIN, and assessment history ($0.03); v1_comps returns arm's-length comparable sales over 18 months with an
    implied low/median/high valuation range ($0.10). No API key: the first 25 paid-route calls per client per day
    are free (X-Free-Tier-Remaining header), then the route answers HTTP 402 with x402 v2 terms (USDC on Base
    eip155:8453 or Solana) and is retried with the payment. Every answer carries as_of, source and cite provenance
    fields and an X-Schema-Version header; the schema is additive-only within /v1. Errors are self-describing JSON
    {error, detail}; 429 per-IP at 120 requests/minute with Retry-After 60s. Coverage is Cook County, Illinois
    only; property-keyed public records with no owner or occupant names.
  humanURL: https://api.ingest0r.com/
  baseURL: https://api.ingest0r.com

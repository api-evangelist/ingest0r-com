aid: ingest0r-com
name: ingest0r
description: >-
  ingest0r operates the Cook County (Chicago) property records API at api.ingest0r.com — a pay-per-call,
  agent-native REST API over Cook County, Illinois public records (~1.9M parcels, refreshed nightly) that resolves
  a street address to its parcel PIN, then returns parcel details, recorded sales and deed history, building
  permits linked to the PIN, property-tax assessment history and comparable-sales valuation as one joined answer.
  There is no signup and no API key: address search and a fixed sample are always free, the first 25 PIN-route
  calls per client per day return real data free, and past that the routes answer HTTP 402 and are settled per call
  in USDC on Base or Solana through the x402 protocol ($0.01, $0.03 and $0.10). The provider publishes an OpenAPI
  3.1, an A2A agent card, a live streamable-HTTP MCP server with five tools, llms.txt, an x402 resource list, a
  machine-readable price card and changelog, and a security.txt — all on api.ingest0r.com. The operator
  identifies itself only as "independent" (the agent card's provider.organization) with a personal contact
  address; the apex ingest0r.com has no DNS A record, so the API host is the website.

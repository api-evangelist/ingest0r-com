  /v1/comps/{pin}:
    get:
      operationId: v1_comps
      summary: 'Comparable sales (comps) and a lightweight automated valuation for
        a Cook County / Chicago property: recent arm''s-length sales in the same…'
      description: 'Comparable sales (comps) and a lightweight automated valuation
        for a Cook County / Chicago property: recent arm''s-length sales in the same
        assessor neighborhood and property class over the last 18 months, with an
        implied low/median/high price range, each comp carrying its distance in metres
        from the subject. Thin markets widen automatically (36 months, then the property-class
        group) and the response reports which rung was used. Non-arm''s-length and
        multi-parcel deeds are filtered out — a derived valuation you won''t get from
        a raw open-data query. For valuation, underwriting, investment screening,
        and due diligence.'
      parameters:
      - name: pin
        in: path
        required: true
        description: Cook County PIN, 10 or 14 digits, dashes ok (14-08-120-017-0000).
          Only have an address? /v1/search first.
        schema:
          type: string
      x-payment-info:
        price:
          mode: fixed
          amount: '0.10'
          currency: USD
        protocols:
        - x402:
            x402Version: 2
            payTo: '0x98D530C0667A4B18e692F182DdCAb1c2bECb5B9B'
            accepts:
            - scheme: exact
              network: eip155:8453

              asset: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
              currency: USDC
              payTo: G3qr8ahZnuFSYjvrCYM4LLDdoLzFq8Boq9XrURVcA9YF
            asset: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
            network: eip155:8453
      responses:
        '200':
          description: Paid result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pin:
                    type: string
                  comps:
                    type: array
                    items:
                      type: object
                      properties:
                        pin:
                          type: string
                        prop_address:
                          type: string
                        sale_date:
                          type: string
                        sale_price:
                          type: number
                        deed_type:
                          type: string
                        comp_class:
                          type: string
                        distance_m:
                          type: number
                          description: metres from the subject parcel
                  method:
                    type: string
                    description: which matching rung produced these comps
                  implied_range:
                    type: object
                    properties:
                      low:
                        type: number
                      median:
                        type: number
                      high:
                        type: number
                      n:
                        type: integer
              example:
                pin: 09253060510000
                comps:
                - pin: 09253140190000
                  prop_address: 7452 N OTTAWA AVE
                  sale_date: '2019-08-16'
                  sale_price: 567500
                  deed_type: Warranty
                implied_range:
                  low: 385000
                  median: 470000
                  high: 567500
                  n: 7
        '402':
          description: 'Payment required (x402): pay per the returned challenge and
            retry the request.'
        '400':
          description: invalid_pin — PIN must be 14 digits (or the 10-digit form,
            dashed or not).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: stable machine-readable code
                  detail:
                    type: string
                    description: how to fix the request, in prose
              example:
                error: invalid_pin
        '404':
          description: not_found — well-formed PIN that is not in the Cook County
            parcel universe (coverage is Cook County only).
          content:

  headline: >-
    No account, no API key, no signup, no wallet to start. The OpenAPI declares no securitySchemes because there
    is no credential: address search and the sample are always free, the three PIN routes return real data free
    for the first 25 calls per client per day, and past that allowance the only "credential" is an x402 v2
    payment — the route answers HTTP 402 with machine-readable terms and is retried with a signed USDC payment on
    Base or Solana. derive-authentication.py therefore produced nothing from the spec; this profile is built from
    the provider's discovery manifest, x402 resource list, pricing endpoint and the live 402 challenge.
